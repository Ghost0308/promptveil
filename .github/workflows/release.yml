name: Release

# Pushing a tag like v0.1.0 builds the package and publishes it to npm with
# trusted publishing, so no npm token is stored anywhere. npm adds provenance
# on its own when it publishes this way.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - name: Check the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "promptveil-${version}.tgz" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match the version in package.json:"
            ls ./*.tgz
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: promptveil-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/promptveil
    permissions:
      id-token: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check npm is new enough for trusted publishing
        run: |
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("trusted publishing needs npm 11.5.1 or newer"); process.exit(1); }
          ' "$(npm --version)"
      - run: npm publish dist/promptveil-*.tgz
